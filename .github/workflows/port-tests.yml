name: OrangeFox port regression tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch reviewed OrangeFox and run tests
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/fox-recovery"
          git -C "$RUNNER_TEMP/fox-recovery" remote add origin https://gitlab.com/OrangeFox/bootable/Recovery.git
          git -C "$RUNNER_TEMP/fox-recovery" fetch --depth=1 origin "$(cat .github/recovery-revision)"
          git -C "$RUNNER_TEMP/fox-recovery" checkout --detach FETCH_HEAD
          python3 tools/apply-recovery-patches.py "$RUNNER_TEMP/fox-recovery"
          python3 tools/validate-port.py "$RUNNER_TEMP/fox-recovery"
      - name: Check reviewed build-system compatibility
        shell: bash
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/fox-build-make"
          git -C "$RUNNER_TEMP/fox-build-make" remote add origin https://github.com/TeamWin/android_build.git
          git -C "$RUNNER_TEMP/fox-build-make" fetch --depth=1 origin "$(cat .github/build-revision)"
          git -C "$RUNNER_TEMP/fox-build-make" checkout --detach FETCH_HEAD
          python3 tools/apply-build-patches.py "$RUNNER_TEMP/fox-build-make"
      - name: Verify real Android 12.1 boot-image tools
        shell: bash
        run: |
          set -euo pipefail
          tools_root="$RUNNER_TEMP/fox-image-tools"
          tools_dir="$tools_root/system/tools/mkbootimg"
          git init "$tools_dir"
          git -C "$tools_dir" remote add origin https://android.googlesource.com/platform/system/tools/mkbootimg
          git -C "$tools_dir" fetch --depth=1 origin "$(cat .github/mkbootimg-revision)"
          git -C "$tools_dir" checkout --detach FETCH_HEAD
          python3 .github/tests/test-artifact-validation.py "$GITHUB_WORKSPACE" "$tools_root"
