name: OrangeFox NX733J validated build
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Linux runner (self-hosted must have Android build dependencies)
        type: choice
        default: self-hosted
        options:
          - self-hosted
          - ubuntu-22.04
permissions:
  contents: read
concurrency:
  group: orangefox-nx733j-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Prepare paths
        run: |
          set -euo pipefail
          echo "FOX_ROOT=$RUNNER_TEMP/fox-nx733j-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/build-artifacts"
      - name: Prepare disposable hosted runner
        if: inputs.runner == 'ubuntu-22.04'
        run: |
          set -euo pipefail
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig python3 python-is-python3 libssl-dev liblz4-tool lzop bc rsync ccache openjdk-11-jdk-headless
          mkdir -p "$HOME/bin"
          curl --fail --location https://storage.googleapis.com/git-repo-downloads/repo -o "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Sync official OrangeFox 12.1 into a new build directory
        run: |
          set -euo pipefail
          [[ ! -e "$FOX_ROOT" ]]
          command -v repo
          command -v ccache
          sync_dir="$RUNNER_TEMP/fox-sync-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          git clone https://gitlab.com/OrangeFox/sync.git "$sync_dir"
          git -C "$sync_dir" checkout --detach "$(cat .github/sync-revision)"
          cd "$sync_dir"
          bash orangefox_sync.sh --branch 12.1 --path "$FOX_ROOT" 2>&1 | tee "$GITHUB_WORKSPACE/build-artifacts/sync.log"
          for item in 'bootable/recovery:recovery' 'vendor/recovery:vendor'; do
            project=${item%:*}
            pin=$(cat "$GITHUB_WORKSPACE/.github/${item#*:}-revision")
            git -C "$FOX_ROOT/$project" fetch origin "$pin"
            git -C "$FOX_ROOT/$project" checkout --detach "$pin"
          done
      - uses: actions/cache@v4
        with:
          path: ${{ env.FOX_ROOT }}/out/ccache
          key: fox12-nx733j-ccache-${{ runner.os }}-${{ github.sha }}-${{ github.run_id }}
          restore-keys: fox12-nx733j-ccache-${{ runner.os }}-
      - name: Test, build exact device commit and inspect final ramdisk
        run: |
          set -Ee -o pipefail
          cd "$FOX_ROOT"
          bash "$GITHUB_WORKSPACE/tools/build-validated.sh" "$GITHUB_WORKSPACE/build-artifacts"
      - name: Upload artifacts and diagnostic logs (no release)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-NX733J-${{ github.run_id }}-${{ github.run_attempt }}
          path: build-artifacts/
          if-no-files-found: warn
          retention-days: 14
